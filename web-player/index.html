<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#09090b">
  <title>YouTube X — Player</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#09090b;color:#fafafa;font-family:Inter,Arial,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:22px}
    main{width:min(100%,960px);text-align:center}
    .brand{font-size:clamp(30px,7vw,54px);font-weight:850;letter-spacing:-2px}
    .brand span{color:#ff3030}
    .sub{color:#a1a1aa;margin:10px 0 26px}
    #frame{width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;display:none}
    iframe{width:100%;height:100%;border:0}
    #welcome{padding:38px 22px;border:1px solid #27272a;border-radius:16px;background:#111113}
    #welcome p{color:#a1a1aa;line-height:1.6;margin:8px auto;max-width:560px}
    .hint{font-size:13px;color:#71717a;margin-top:18px}
    .error{color:#fca5a5}
  </style>
</head>
<body>
<main>
  <div class="brand">YouTube <span>X</span></div>
  <div class="sub">Your YouTube X embedded player</div>
  <section id="welcome">
    <h2 id="heading">Player ready</h2>
    <p id="description">Open a video from the YouTube X app to play it here. This page needs a valid video ID to start playback.</p>
    <p class="hint">Example format: https://l6322059-max.github.io/YouTube-X/?v=VIDEO_ID</p>
  </section>
  <div id="frame"></div>
</main>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const raw = params.get('v') || params.get('videoId') || '';
  const id = raw.trim();
  const frame = document.getElementById('frame');
  const welcome = document.getElementById('welcome');

  if (!id) return;

  if (!/^[a-zA-Z0-9_-]{11}$/.test(id)) {
    document.getElementById('heading').textContent = 'Invalid video link';
    document.getElementById('description').textContent = 'The video ID must be exactly 11 characters. Return to YouTube X and open the video again.';
    document.getElementById('description').className = 'error';
    return;
  }

  // Privacy-enhanced YouTube embed, using the video ID supplied by the app.
  const iframe = document.createElement('iframe');
  iframe.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?rel=0';
  iframe.title = 'YouTube video player';
  iframe.setAttribute('frameborder', '0');
  iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  iframe.referrerPolicy = 'strict-origin-when-cross-origin';
  iframe.allowFullscreen = true;

  frame.replaceChildren(iframe);
  frame.style.display = 'block';
  welcome.style.display = 'none';
})();
</script>
</body>
</html>
