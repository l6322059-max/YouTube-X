<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YouTube X Player</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
    main{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    #frame{width:100%;aspect-ratio:16/9;max-height:100%;background:#000}
    iframe{width:100%;height:100%;border:0}
    #message{padding:24px;text-align:center;color:#ddd}
  </style>
</head>
<body>
<main><div id="frame"><div id="message">Loading YouTube player…</div></div></main>
<script>
(function(){
  const id = new URLSearchParams(location.search).get('v') || '';
  const frame = document.getElementById('frame');
  if (!/^[a-zA-Z0-9_-]{11}$/.test(id)) {
    document.getElementById('message').textContent = 'Invalid or missing YouTube video ID.';
    return;
  }
  const iframe = document.createElement('iframe');
  const params = new URLSearchParams({
    autoplay: '1', playsinline: '1', controls: '1', rel: '0',
    enablejsapi: '1', origin: location.origin
  });
  iframe.src = 'https://www.youtube.com/embed/' + encodeURIComponent(id) + '?' + params.toString();
  iframe.title = 'YouTube video player';
  iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  iframe.allowFullscreen = true;
  iframe.referrerPolicy = 'strict-origin-when-cross-origin';
  frame.replaceChildren(iframe);
})();
</script>
</body>
</html>
