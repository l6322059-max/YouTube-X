name: Build Android + Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name=youtube_x
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: flutter build apk --release --dart-define=YOUTUBE_API_KEY="$YOUTUBE_API_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-X-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Windows platform files
        run: flutter create . --platforms=windows --project-name=youtube_x
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: flutter build windows --release --dart-define=YOUTUBE_API_KEY="$env:YOUTUBE_API_KEY"
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath YouTube-X-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-X-Windows-x64
          path: YouTube-X-Windows-x64.zip
          if-no-files-found: error
