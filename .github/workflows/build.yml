name: Build Android + Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name=youtube_x
      - name: Use direct Gradle distribution mirror
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          content = wrapper.read_text()
          content = content.replace(
              "https://services.gradle.org/distributions/",
              "https://downloads.gradle.org/distributions/"
          )
          content = content.replace(
              "https://github.com/gradle/gradle-distributions/releases/download/",
              "https://downloads.gradle.org/distributions/"
          )
          wrapper.write_text(content)
          print("Gradle distribution URL:", [line for line in content.splitlines() if line.startswith("distributionUrl=")][0])
          PY
      - name: Add Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = 'android.permission.INTERNET'
          if permission not in text:
              end = text.find('>')
              if end < 0:
                  raise SystemExit("Could not find the manifest opening tag")
              text = text[:end + 1] + '\n    <uses-permission android:name="android.permission.INTERNET" />' + text[end + 1:]
              manifest.write_text(text)
          print("INTERNET permission present:", permission in text)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build release APK (retry transient download failures)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            echo "Android build attempt $attempt of 4"
            if flutter build apk --release --dart-define=YOUTUBE_API_KEY="$YOUTUBE_API_KEY"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Build failed; waiting before retrying dependency downloads..."
              sleep $((attempt * 30))
            fi
          done
          echo "Android build failed after 4 attempts."
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-X-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows platform files
        run: flutter create . --platforms=windows --project-name=youtube_x
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: flutter build windows --release --dart-define=YOUTUBE_API_KEY="$env:YOUTUBE_API_KEY"
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath YouTube-X-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-X-Windows-x64
          path: YouTube-X-Windows-x64.zip
          if-no-files-found: error
